<VirtualHost *:80>
    DocumentRoot /var/www/public
    DirectoryIndex index.php

    <Directory /var/www/public>
        AllowOverride All
        Require all granted
    </Directory>

    # Opcje dla PHP
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>
