[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor


[program:apache2]
command=apache2-foreground
autostart=true
autorestart=true
priority=1


[program:vite]
command=npm run dev
directory=/var/www
autostart=true
autorestart=true
priority=2
startretries=3
startsecs=5

[program:migrate]
command=sh /var/www/wait-for-db.sh
directory=/var/www
autostart=true
autorestart=false
startsecs=5
stdout_logfile=/var/log/supervisor/migrate.log
stderr_logfile=/var/log/supervisor/migrate.err.log

[include]
files = /etc/supervisor/conf.d/*.conf